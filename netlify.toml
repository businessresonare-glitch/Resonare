# Netlify configuration for the RESONARE static site.
#
# The site has no build step — it is plain HTML/CSS/JS — so `publish` is the
# repository root and there is no `command`.

[build]
  publish = "."

# Long-lived caching is deliberately NOT applied to /assets/*. The filenames
# are not content-hashed, so a year-long immutable cache would strand visitors
# on the old stylesheet after a redeploy. An hour is long enough to help repeat
# views and short enough that a fix reaches people the same morning.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Fonts and hero videos never change without their filename changing, so they
# can be cached hard.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
