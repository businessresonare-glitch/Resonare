<svg xmlns="http://www.w3.org/2000/svg" viewBox="45 62 905 905" width="905" height="905" role="img" aria-label="MK — Muhibah Kukuh">
  <!--
    The MK mark: a glossy orange sphere, a gold ribbon sashed across it, and a
    brushed chrome crescent riding over the top.

    A vector rebuild of the client's 3D render, not the render itself. Drawn in
    flat gradients so it stays crisp at 46px in the header and as a favicon,
    where the original's soft raytraced shading would go to mud. If the source
    PNG is supplied it should replace this — see README.

    The wrap is sold by a blurred cast shadow on the sphere beneath the ribbon,
    clipped to the ball. Without it the band reads as a flat sticker lying on a
    circle rather than as something passing in front of a solid.
  -->
  <defs>
    <radialGradient id="mkBall" cx="0.38" cy="0.27" r="0.88">
      <stop offset="0"    stop-color="#FFC64F"/>
      <stop offset="0.22" stop-color="#F98A22"/>
      <stop offset="0.55" stop-color="#EE5F13"/>
      <stop offset="0.82" stop-color="#D33C08"/>
      <stop offset="1"    stop-color="#9E2604"/>
    </radialGradient>

    <radialGradient id="mkSpec">
      <stop offset="0"   stop-color="#FFF6DC" stop-opacity=".85"/>
      <stop offset="0.6" stop-color="#FFE0A0" stop-opacity=".22"/>
      <stop offset="1"   stop-color="#FFE0A0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="mkRim">
      <stop offset="0" stop-color="#FF9440" stop-opacity=".75"/>
      <stop offset="1" stop-color="#FF9440" stop-opacity="0"/>
    </radialGradient>

    <!-- across the band, not along it: the ribbon reads round because the
         gradient runs from its shaded top edge through a hot core to a dark
         underside -->
    <linearGradient id="mkGold" x1="520" y1="286" x2="450" y2="676" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#D98F16"/>
      <stop offset="0.12" stop-color="#FFE188"/>
      <stop offset="0.32" stop-color="#FBBB2E"/>
      <stop offset="0.58" stop-color="#EC9713"/>
      <stop offset="0.83" stop-color="#BC6F0A"/>
      <stop offset="1"    stop-color="#874C04"/>
    </linearGradient>

    <linearGradient id="mkChrome" x1="0" y1="238" x2="0" y2="524" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#FFFFFF"/>
      <stop offset="0.28" stop-color="#F4F8FC"/>
      <stop offset="0.50" stop-color="#C7D2DD"/>
      <stop offset="0.70" stop-color="#8E9CAC"/>
      <stop offset="0.87" stop-color="#667382"/>
      <stop offset="1"    stop-color="#47535F"/>
    </linearGradient>

    <clipPath id="mkBallClip"><circle cx="500" cy="505" r="295"/></clipPath>
    <filter id="mkSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <!-- the sphere -->
  <circle cx="500" cy="505" r="295" fill="url(#mkBall)"/>
  <g clip-path="url(#mkBallClip)">
    <ellipse cx="402" cy="340" rx="134" ry="90" fill="url(#mkSpec)" transform="rotate(-28 402 340)"/>
    <ellipse cx="516" cy="744" rx="214" ry="78" fill="url(#mkRim)"/>
    <!-- cast shadow of the sash -->
    <path d="M60 402 C60 322, 152 290, 242 322 C332 354, 432 426, 542 484
             C662 546, 792 578, 886 534 C930 558, 938 618, 902 654
             C802 712, 652 690, 522 634 C398 580, 288 498, 202 470
             C132 446, 66 470, 60 402 Z"
          fill="#5A1A02" opacity=".55" filter="url(#mkSoft)"/>
  </g>

  <!-- the gold sash -->
  <path d="M60 380
           C60 300, 150 268, 240 300
           C330 332, 430 404, 540 462
           C660 524, 790 556, 884 512
           C908 530, 914 578, 882 606
           C792 656, 648 648, 520 600
           C396 558, 286 476, 200 448
           C130 424, 66 448, 60 380 Z"
        fill="url(#mkGold)"/>
  <path d="M86 358 C104 306, 172 292, 252 322 C344 356, 442 428, 552 486 C668 546, 790 574, 878 532"
        fill="none" stroke="#FFEDB6" stroke-width="15" opacity=".55" stroke-linecap="round"/>

  <!-- the chrome crescent, over everything -->
  <path d="M352 300
           C500 232, 706 240, 830 322
           C906 372, 924 452, 872 496
           C838 520, 800 506, 806 470
           C812 424, 762 390, 674 364
           C574 336, 442 318, 352 300 Z"
        fill="url(#mkChrome)"/>
  <path d="M360 302 C500 240, 700 248, 820 328"
        fill="none" stroke="#FFFFFF" stroke-width="7" opacity=".85" stroke-linecap="round"/>
  <path d="M806 470 C812 424, 762 390, 674 364 C574 336, 442 318, 352 300"
        fill="none" stroke="#5B6874" stroke-width="4" opacity=".5" stroke-linecap="round"/>
</svg>
