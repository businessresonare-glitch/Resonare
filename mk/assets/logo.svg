<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="MK — Muhibah Kukuh">
  <defs>
    <linearGradient id="mkSwoosh" x1="18" y1="72" x2="102" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C8340E"/>
      <stop offset=".45" stop-color="#F26A21"/>
      <stop offset="1" stop-color="#FBB040"/>
    </linearGradient>
    <linearGradient id="mkSwooshHi" x1="30" y1="66" x2="94" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD98A" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFF3D6" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="mkRing" x1="14" y1="10" x2="106" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBC66A"/>
      <stop offset=".5" stop-color="#E0912C"/>
      <stop offset="1" stop-color="#F5B759"/>
    </linearGradient>
    <path id="mkArcTop" d="M 60 60 m -45 0 a 45 45 0 1 1 90 0" fill="none"/>
    <path id="mkArcBot" d="M 60 60 m 41 0 a 41 41 0 1 1 -82 0" fill="none"/>
  </defs>

  <!-- badge body -->
  <circle cx="60" cy="60" r="59" fill="#10142A"/>
  <circle cx="60" cy="60" r="59" fill="none" stroke="url(#mkRing)" stroke-width="2"/>
  <circle cx="60" cy="60" r="52.5" fill="none" stroke="url(#mkRing)" stroke-width="1.1" opacity=".75"/>

  <!-- the swoosh: a broad orange wave rising left-to-right -->
  <path d="M20 74c9.5-15 22-23.5 37.5-25.5 12-1.6 22.5 1.2 33 8.4 3.4 2.3 6.4 5 9 8.1-6.9-4.2-13.9-6.9-21-8-13.4-2.1-25.4 1.3-36 10.2-4.6 3.9-8.4 8.5-11.4 13.8-1.2 2.1-2.4 2.6-4.4 1.6l-6-3c-2.1-1.1-2.4-2.6-.7-5.6z"
        fill="url(#mkSwoosh)"/>
  <path d="M30.5 78.5c8.6-11.7 19.7-18.4 33.3-19.8 9.3-1 18 .9 26.2 5.6-9.2-3.2-18.3-3.9-27.2-1.9-11.2 2.5-20.4 8.6-27.6 18.4z"
        fill="url(#mkSwooshHi)"/>
  <!-- spark: the electrical half of the trade -->
  <path d="M63 30.5l-9.5 15.8h7.2L57.5 59l12-16.6h-7.3z" fill="url(#mkRing)"/>

  <!-- ring text -->
  <text font-family="Manrope, system-ui, sans-serif" font-size="9.2" font-weight="800"
        letter-spacing="2.6" fill="url(#mkRing)">
    <textPath href="#mkArcBot" startOffset="50%" text-anchor="middle">MUHIBAH KUKUH</textPath>
  </text>
  <text font-family="Manrope, system-ui, sans-serif" font-size="7.4" font-weight="700"
        letter-spacing="3.4" fill="#F6E3C0" opacity=".72">
    <textPath href="#mkArcTop" startOffset="50%" text-anchor="middle">PLUMBING &amp; CONSTRUCTION</textPath>
  </text>
</svg>
